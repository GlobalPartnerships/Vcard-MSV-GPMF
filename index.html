<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Marcela Sánchez Vargas</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Colores GPMF (mantener) */
            --gpmf-burgundy: #7A0F32;
            
            /* Colores Gamma adicionales */
            --gamma-purple: #667eea;
            --gamma-blue: #4facfe;
            --gamma-pink: #f093fb;
            --gamma-orange: #fa709a;
            --gamma-green: #30cfd0;
            
            /* Grises suaves */
            --gray-50: #fafafa;
            --gray-100: #f5f5f5;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-900: #1a1a1a;
            
            /* Gamma Style Variables */
            --shadow-soft: 0 20px 60px -10px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 30px 80px -15px rgba(0, 0, 0, 0.15);
            --radius-card: 2rem;
            --radius-btn: 9999px;
            --transition-fluid: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--gray-50);
            background: linear-gradient(-45deg, #f5f5f5, #ebebeb, #fafafa, #fdfdfd);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--gray-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
            border-radius: 50%;
            animation: float 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .blob-1 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--gamma-purple), var(--gamma-blue));
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, var(--gamma-pink), var(--gamma-orange));
            bottom: -50px;
            right: -50px;
            animation-delay: 2s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        .digital-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: var(--radius-card);
            padding: 4rem;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-fluid);
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            text-align: center;
            overflow: hidden;
        }

        .card-banner {
            width: calc(100% + 8rem);
            margin: -4rem -4rem 0 -4rem;
            height: 180px;
            background-image: url('assets/banner-connect.png');
            background-size: cover;
            background-position: center;
            position: relative;
            z-index: 1;
        }

        .digital-card:hover {
            transform: translateY(-12px);
            box-shadow: var(--shadow-hover);
        }

        .profile-pic-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: -100px auto 0 auto;
            z-index: 2;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }



        .user-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .name {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            background: linear-gradient(to right, var(--gray-900), var(--gpmf-burgundy));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .role {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--gray-600);
            font-style: italic;
        }
        
        .company {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gpmf-burgundy);
            font-weight: 800;
            margin-top: 0.5rem;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.25rem 2rem;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-btn);
            color: var(--gray-900);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: var(--transition-fluid);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .btn-link i {
            font-size: 1.25rem;
            color: var(--gpmf-burgundy);
            transition: var(--transition-fluid);
        }

        .btn-link::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: translateX(-100%);
            transition: 0.6s;
        }

        .btn-link:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1);
            background: white;
            color: var(--gpmf-burgundy);
        }

        .btn-link:hover i {
            transform: scale(1.2);
            color: var(--gamma-purple);
        }

        .btn-link:hover::before {
            transform: translateX(100%);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gpmf-burgundy), var(--gamma-pink));
            color: white !important;
            border: none;
            box-shadow: 0 10px 20px rgba(122, 15, 50, 0.2);
        }
        
        .btn-primary i {
            color: white !important;
        }

        .btn-primary:hover {
            box-shadow: 0 20px 40px rgba(122, 15, 50, 0.3);
            transform: translateY(-5px) scale(1.02);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            color: var(--gray-600);
            font-size: 1.25rem;
            text-decoration: none;
            transition: var(--transition-fluid);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .social-icon:hover {
            background: white;
            color: var(--gamma-blue);
            transform: translateY(-8px) rotate(8deg);
            box-shadow: 0 12px 20px rgba(0,0,0,0.08);
        }

        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .digital-card {
                padding: 3rem 2rem;
            }
            .name {
                font-size: 2.25rem;
            }
        }

        /* QR Button & Modal */
        .qr-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--gpmf-burgundy);
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: var(--transition-fluid);
        }
        .qr-btn:hover {
            transform: scale(1.1) rotate(5deg);
            background: white;
            color: var(--gamma-purple);
        }
        .qr-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .qr-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .qr-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: var(--shadow-hover);
            text-align: center;
            transform: translateY(20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .qr-overlay.active .qr-card {
            transform: translateY(0) scale(1);
        }
        .qr-card h3 {
            margin-top: 1.5rem;
            color: var(--gray-900);
            font-size: 1.1rem;
            font-weight: 600;
        }
        .vcard-footer {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 2rem;
            padding-bottom: 2rem;
            font-size: 0.95rem;
            color: var(--gray-600);
        }
        .vcard-footer a {
            color: var(--gpmf-burgundy);
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition-fluid);
            margin: 0 0.5rem;
        }
        .vcard-footer a:hover {
            color: var(--gamma-purple);
        }
    </style>
</head>
<body>

    <!-- Fondos decorativos -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Tarjeta Principal -->
    <main class="digital-card">
        

        <!-- QR Button -->
        <button id="showQrBtn" class="qr-btn" title="Mostrar Código QR">
            <i class="fa-solid fa-qrcode"></i>
        </button>

        <!-- Banner Header -->
        <div class="card-banner fade-in-up"></div>

        <div class="profile-pic-container fade-in-up delay-1">
            <!-- Placeholder para la foto de perfil -->
            <img src="assets/marceperfil.jpg" alt="Foto de Perfil Marcela" class="profile-pic">
        </div>

        <div class="user-info fade-in-up delay-1">
            <h1 class="name">Marcela Sánchez Vargas</h1>
            <p class="role">Co-Fundadora & Business Development</p>
            <p class="company">Global Partnerships & Multidisciplinary Firm</p>
        </div>

        <div class="links-container fade-in-up delay-2">
            <a href="mailto:contacto.gpmfsas@gmail.com" class="btn-link">
                <i class="fa-solid fa-envelope"></i>
                Enviar Correo
            </a>
            
            <a id="addToContacts" class="btn-link">
                <i class="fa-solid fa-download"></i>
                Descargar vCard
            </a>
            
            <a href="https://globalpartnerships.vercel.app/en" class="btn-link">
                <i class="fa-solid fa-globe"></i>
                Visitar Sitio Web
            </a>
        </div>

        <div class="social-icons fade-in-up delay-3">
            <a href="https://www.linkedin.com/company/gpmf" title="LinkedIn GPMF" class="social-icon"><i class="fa-solid fa-building"></i></a>
            <a href="https://www.linkedin.com/in/marcelasanchezintercultural/" title="LinkedIn Personal" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
            
            <a href="https://globalpartnerships.vercel.app/en" title="Sitio Web GPMF" class="social-icon">
                <img src="assets/logo/burgundy ball.png" alt="GPMF" style="width: 36px; height: 36px; object-fit: contain;">
            </a>

            <a href="https://github.com/GlobalPartnerships" title="GitHub Corporativo" class="social-icon"><i class="fa-brands fa-github"></i></a>
            <a href="https://wa.me/573156166760" title="WhatsApp" class="social-icon"><i class="fa-brands fa-whatsapp"></i></a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="vcard-footer fade-in-up delay-3">
        <p>
            <a href="portfolio.html"><i class="fa-solid fa-briefcase"></i> Executive Portfolio</a> • 
            <a href="https://globalpartnerships.vercel.app/en"><i class="fa-solid fa-globe"></i> GPMF Website</a>
        </p>
    </footer>

    <!-- QR Overlay -->
    <div id="qrOverlay" class="qr-overlay">
        <div class="qr-card">
            <div id="qrcode"></div>
            <h3>Escanea para ver la tarjeta</h3>
        </div>
    </div>

    <!-- qrcode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // QR Code Logic
        let qrGenerated = false;
        const overlay = document.getElementById('qrOverlay');
        
        document.getElementById('showQrBtn').addEventListener('click', () => {
            overlay.classList.add('active');
            if (!qrGenerated) {
                new QRCode(document.getElementById("qrcode"), {
                    text: "https://globalpartnerships.github.io/Vcard-MSV-GPMF/", // Siempre apuntará a la VCard online
                    width: 200,
                    height: 200,
                    colorDark : "#2E2E2E",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
                qrGenerated = true;
            }
        });

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
                overlay.classList.remove('active');
            }
        });

        document.getElementById('addToContacts').addEventListener('click', function (e) {
            e.preventDefault();
            const vCard = `BEGIN:VCARD
VERSION:3.0
N:Sánchez Vargas;Marcela;;;
FN:Marcela Sánchez Vargas
TITLE:Co-Fundadora & Business Development
ORG:Global Partnerships & Multidisciplinary Firm
TEL;TYPE=CELL,VOICE,PREF:+573156166760
EMAIL;TYPE=WORK,INTERNET:contacto.gpmfsas@gmail.com
URL:https://globalpartnerships.vercel.app/en
X-SOCIALPROFILE;TYPE=linkedin:https://www.linkedin.com/in/marcelasanchezintercultural/
REV:${new Date().toISOString()}
END:VCARD`;

            const blob = new Blob([vCard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'Marcela_Sanchez_Vargas.vcf';
            document.body.appendChild(a);
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        });
    </script>
</body>
</html>
